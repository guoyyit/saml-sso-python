[project]
name = "saml-sso-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.141.1",
    "lxml>=6.1.3",
    "signxml>=5.1.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
